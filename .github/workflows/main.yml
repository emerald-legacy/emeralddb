name: CI/CD

on:
  push:
    branches:
      - main
      - release
  pull_request:
    branches:
      - main

# Prevent multiple deployments from running simultaneously
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25.x'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn
      - name: Run linter
        run: yarn lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25.x'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn
      - name: Run unit tests
        run: yarn test:unit

  compilation-tests:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '25.x'
          cache: 'yarn'
      - name: Install dependencies
        run: yarn
      - name: Build project
        run: yarn build

  deploy-main:
    name: Deploy to Beta (beta-emeralddb)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, compilation-tests]
    if: github.ref == 'refs/heads/main'
    environment:
      name: beta
      url: https://beta-emeralddb.herokuapp.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@1b080913896a5d6d44a18e9e208f8eb1fee9b0f7 # v3.15.15
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: beta-emeralddb
          heroku_email: ${{secrets.HEROKU_API_EMAIL}}

  deploy-release:
    name: Deploy to Production (emeralddb)
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, compilation-tests]
    if: github.ref == 'refs/heads/release'
    environment:
      name: production
      url: https://emeralddb.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh
      - name: Deploy to Heroku
        uses: akhileshns/heroku-deploy@1b080913896a5d6d44a18e9e208f8eb1fee9b0f7 # v3.15.15
        with:
          heroku_api_key: ${{secrets.HEROKU_API_KEY}}
          heroku_app_name: emeralddb
          heroku_email: ${{secrets.HEROKU_API_EMAIL}}
